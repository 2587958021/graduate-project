<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="400" fill="#E44D26" />
  
  <!-- CSS 标签 -->
  <rect x="350" y="100" width="180" height="200" rx="10" fill="#264DE4" />
  <text x="440" y="210" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="white" text-anchor="middle">CSS</text>
  
  <!-- HTML 标签 -->
  <rect x="70" y="100" width="180" height="200" rx="10" fill="#F16529" />
  <text x="160" y="210" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="white" text-anchor="middle">HTML</text>
  
  <!-- 装饰符号 -->
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">+</text>
  
  <!-- 标题 -->
  <text x="300" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">前端Web开发基础</text>
  
  <!-- 底部文本 -->
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">构建现代化的网页应用</text>
</svg> 