<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="400" fill="#282C34" />
  
  <!-- React Logo -->
  <g transform="translate(300, 200) scale(1.2)">
    <!-- 外圈椭圆 -->
    <ellipse rx="100" ry="30" fill="none" stroke="#61DAFB" stroke-width="6" transform="rotate(30)" />
    <ellipse rx="100" ry="30" fill="none" stroke="#61DAFB" stroke-width="6" transform="rotate(90)" />
    <ellipse rx="100" ry="30" fill="none" stroke="#61DAFB" stroke-width="6" transform="rotate(150)" />
    
    <!-- 中心圆点 -->
    <circle r="18" fill="#61DAFB" />
  </g>
  
  <!-- 标题 -->
  <text x="300" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">React框架开发</text>
  
  <!-- 副标题 -->
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="24" fill="#61DAFB" text-anchor="middle">组件化开发与状态管理</text>
</svg> 