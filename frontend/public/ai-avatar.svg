<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6cf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcf9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feComposite in="blur" in2="SourceGraphic" operator="over" />
    </filter>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" />
  
  <!-- 机器人头部 -->
  <rect x="60" y="60" width="80" height="70" rx="15" ry="15" fill="#ffffff" filter="url(#glow)" />
  
  <!-- 机器人眼睛 -->
  <circle cx="80" cy="85" r="10" fill="#4a6cf7" />
  <circle cx="120" cy="85" r="10" fill="#4a6cf7" />
  
  <!-- 机器人天线 -->
  <line x1="100" y1="60" x2="100" y2="40" stroke="#ffffff" stroke-width="4" />
  <circle cx="100" cy="35" r="6" fill="#ffffff" />
  
  <!-- 机器人嘴巴 -->
  <path d="M75,105 Q100,125 125,105" stroke="#4a6cf7" stroke-width="4" fill="none" />
  
  <!-- 脉冲圆环，表示AI活跃状态 -->
  <circle cx="100" cy="100" r="98" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3">
    <animate attributeName="r" from="85" to="98" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="0.6" to="0" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg> 